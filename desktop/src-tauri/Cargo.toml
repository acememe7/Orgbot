[package]
name = "orgbot-desktop"
version = "0.1.0"
description = "OrgBot desktop: rooms of AI agents that work project folders, hosted locally"
edition = "2021"

[lib]
name = "orgbot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
gptbots-server = { path = "../../core/crates/gptbots-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OrgBot</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #12151b; color: #e8ebf0; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid #262b34; }
  header .logo { width: 30px; height: 30px; border-radius: 8px; }
  header h1 { font-size: 17px; margin: 0; }
  .spacer { flex: 1; }
  .chip { font-size: 12px; padding: 3px 10px; border-radius: 12px; background: #262b34; }
  nav { display: flex; gap: 4px; padding: 8px 18px 0; }
  nav button { background: none; border: 0; color: inherit; padding: 8px 16px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 14px; }
  nav button.active { background: #1d222b; box-shadow: inset 0 -2px 0 #6d8bff; }
  main { min-height: 0; flex: 1; overflow: auto; padding: 18px; }
  .panel { display: none; }
  .panel.active { display: block; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .card { background: #1a1f28; border: 1px solid #2a3140; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .card .muted { opacity: .6; font-size: 12px; }
  button.primary, button.ghost { border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
  button.primary { background: #6d8bff; color: #0c0f14; font-weight: 600; }
  button.ghost { background: #2a3140; color: inherit; }
  label { display: block; font-size: 12px; opacity: .75; margin: 10px 0 4px; }
  input, textarea, select { width: 100%; background: #12161d; color: inherit; border: 1px solid #2a3140; border-radius: 8px; padding: 8px 10px; font: inherit; }
  textarea { resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .botrow { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .botrow select, .botrow .who { flex: 1; }
  .err { color: #ff8f8f; font-size: 13px; margin-top: 8px; white-space: pre-wrap; }
  .ok { color: #93d9a0; }
  #live { display: none; flex: 1; min-height: 0; flex-direction: column; }
  #live.show { display: flex; }
  main.hasLive { display: none; }
  .livecols { flex: 1; display: flex; min-height: 0; }
  #lchat { position: relative; min-height: 0; flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #lmessages { min-height: 0; flex: 1; overflow-y: auto; overflow-anchor: auto; overscroll-behavior: contain; padding: 10px 14px; }
  #chatLatest { position: absolute; bottom: 78px; left: 50%; transform: translateX(-50%); border: 1px solid #46535a; box-shadow: 0 4px 18px #0005; }
  #chatLatest[hidden] { display: none; }
  #lmessages:empty::before { content: 'No messages yet'; color: #a5afb6; }
  #lboard { width: 300px; border-left: 1px solid #262b34; overflow: auto; padding: 10px; }
  .bmsg { margin: 8px 0; }
  .bmsg .who { font-size: 12px; font-weight: 600; }
  .bmsg .body { background: #20242e; padding: 6px 10px; border-radius: 8px; white-space: pre-wrap; font-size: 13px; }
  .tcard { border: 1px solid #2a3140; border-left-width: 3px; border-radius: 8px; padding: 8px; margin: 6px 0; font-size: 12px; }
  #composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #262b34; }
  #composer input { flex: 1; }
</style>
</head>
<body>
<header>
  <img class="logo" id="logoImg" alt="" />
  <h1>OrgBot</h1>
  <span class="chip" id="connChip">offline</span>
  <span class="spacer"></span>
  <span class="chip" id="hostChip">no room running</span>
</header>
<nav id="tabs">
  <button data-panel="bots" class="active">Bots</button>
  <button data-panel="rooms">Rooms</button>
</nav>
<main id="main">
  <section id="panel-bots" class="panel active">
    <div class="row">
      <h2 style="flex:1;margin:0">Your bots</h2>
      <button class="primary" id="newBotBtn">+ New bot</button>
    </div>
    <div id="botList"></div>
    <div id="botFormWrap"></div>
  </section>
  <section id="panel-rooms" class="panel">
    <div class="row">
      <h2 style="flex:1;margin:0">Rooms — group chats of your bots</h2>
      <button class="primary" id="newRoomBtn">+ New room</button>
    </div>
    <div id="roomList"></div>
    <div id="roomFormWrap"></div>
  </section>
</main>
<div id="live">
  <div style="display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid #262b34">
    <strong id="liveName"></strong>
    <span class="muted" id="liveGoal"></span>
    <span class="chip" id="livePhase"></span>
    <span class="spacer"></span>
    <button class="ghost" id="pauseBtn">Pause</button>
    <button class="primary" id="stopRoomBtn">Stop room</button>
  </div>
  <div class="livecols">
    <div id="lchat">
      <div id="lmessages" tabindex="0" aria-label="Room messages"></div>
      <button id="chatLatest" class="ghost" hidden>Jump to latest</button>
      <div id="composer"><input id="msgBox" placeholder="Message the room…" /><button class="primary" id="sendBtn">Send</button></div>
    </div>
    <div id="lboard"></div>
  </div>
</div>
<script src="./app.js"></script>
</body>
</html>

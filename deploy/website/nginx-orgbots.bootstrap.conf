# Install as /etc/nginx/sites-available/orgbots.theaecestudio.com only after
# orgbots DNS points to this origin. HTTP-01 uses the existing Certbot webroot.
server {
    listen 80;
    listen [::]:80;
    server_name orgbots.theaecestudio.com;

    server_tokens off;
    root /var/www/orgbots/current;
    index index.html;
    error_page 404 /404.html;
    access_log /var/log/nginx/orgbots-access.log;
    error_log /var/log/nginx/orgbots-error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Gvc2gNC7qioVBVuOme4xWXG9doT29IHgmHthc0rHDTU=' 'sha256-GagkLMsYSNgL9+VoiziXVl2rfELqUTSAuGTY/GyYMMs=' 'sha256-4k4V4gml3YEVvMn2zLQsbXz9cHDpCDIrc/zfEWLwIxU=' 'sha256-EhtPyU+v7ykUwQSfmreINnn0k5OSWlck3S7Qjm1Xz5g=' 'sha256-Cg7tlReMm9mThU45/pP1dVrmDFwd63tIiFxuI8E4lro=' 'sha256-nRoKSEFoi54F0GT1Tnbkze0+zLGvFBk65nCiXpWHB8Q=' 'sha256-tq1l9wkC+SlXizCobdBR6s7dpydqcdEMA8bLi4qJ4fM='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /404.html { internal; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}

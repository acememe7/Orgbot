# Final vhost draft. Install only after DNS points to this origin and the
# orgbots.theaecestudio.com Certbot lineage exists and passes certificate checks.
server {
    listen 80;
    listen [::]:80;
    server_name orgbots.theaecestudio.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://orgbots.theaecestudio.com$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name orgbots.theaecestudio.com;

    ssl_certificate /etc/letsencrypt/live/orgbots.theaecestudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orgbots.theaecestudio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/orgbots/current;
    index index.html;
    server_tokens off;
    error_page 404 /404.html;
    access_log /var/log/nginx/orgbots-access.log;
    error_log /var/log/nginx/orgbots-error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-UWHHQyZKJOdCx9kRIT0SwzCYXFNDGUO/Fo9ltc8tSEo=' 'sha256-cEzEZzpOFB6jrpEtaQWA0YEeC11FYd0KrQxJAoHMqvc='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /404.html { internal; }
    location ~ /\. { deny all; }
    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|otf)$ { expires 10m; }
    location / { try_files $uri $uri/ =404; }
}

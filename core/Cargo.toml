[workspace]
resolver = "2"
members = [
    "crates/orgbot-proto",
    "crates/orgbot-engine",
    "crates/orgbot-providers",
    "crates/orgbot-tools",
    "crates/orgbot-runtime",
    "crates/orgbot-server",
    "crates/orgbot-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license-file = "../LICENSE"

[workspace.dependencies]
orgbot-proto     = { path = "crates/orgbot-proto" }
orgbot-engine    = { path = "crates/orgbot-engine" }
orgbot-providers = { path = "crates/orgbot-providers" }
orgbot-tools     = { path = "crates/orgbot-tools" }
orgbot-runtime   = { path = "crates/orgbot-runtime" }
orgbot-server    = { path = "crates/orgbot-server" }

anyhow      = "1"
thiserror   = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
uuid        = { version = "1", features = ["v4", "serde"] }
sha2        = "0.10"
time        = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "io-std", "process", "signal", "net"] }
tokio-util  = "0.7"
futures     = "0.3"
toml        = "0.8"
async-trait = "0.1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest     = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
